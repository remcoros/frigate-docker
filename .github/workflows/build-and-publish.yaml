name: Build and Publish Docker Image (Multi-Arch)

on:
  workflow_dispatch:
  push:
    paths-ignore: ['*.md']
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build each variant x arch, push by digest, upload digest as artifact.
  #
  # Variants:
  #   default  - generic + nvidia + intel; built for amd64 + arm64 from Dockerfile
  #              (Intel OpenCL runtime is included on amd64 only via if-check)
  #   amd      - AMD GPU (Mesa Rusticl OpenCL); built for amd64 only from Dockerfile.amd
  # ---------------------------------------------------------------------------
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # default variant - amd64
          - variant: default
            arch: amd64
            platform: linux/amd64
            dockerfile: Dockerfile
            runner: ubuntu-latest
          # default variant - arm64
          - variant: default
            arch: arm64
            platform: linux/arm64
            dockerfile: Dockerfile
            runner: ubuntu-24.04-arm
          # amd variant - amd64 only
          - variant: amd
            arch: amd64
            platform: linux/amd64
            dockerfile: Dockerfile.amd
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image vars
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest - ${{ matrix.variant }}/${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=frigate-docker-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=frigate-docker-${{ matrix.variant }}-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false
          outputs: type=registry,push-by-digest=true,name=ghcr.io/${{ steps.vars.outputs.owner }}/frigate-docker

      - name: Write digest file
        run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.variant }}-${{ matrix.arch }}.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digest-${{ matrix.variant }}-${{ matrix.arch }}.txt

  # ---------------------------------------------------------------------------
  # Assemble multi-arch manifests from per-arch digests and push final tags.
  #
  # Tags produced on main branch push:
  #   :main, :{sha}                          (default variant)
  #   :main-amd, :{sha}-amd                  (amd variant)
  #
  # Tags produced on version tag (v*.*.*):
  #   :{version}, :latest                    (default variant)
  #   :{version}-amd, :latest-amd            (amd variant)
  # ---------------------------------------------------------------------------
  manifest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image vars
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Download all digest artifacts
      - uses: actions/download-artifact@v4
        with:
          name: digest-default-amd64
          path: digests/default/amd64
      - uses: actions/download-artifact@v4
        with:
          name: digest-default-arm64
          path: digests/default/arm64
      - uses: actions/download-artifact@v4
        with:
          name: digest-amd-amd64
          path: digests/amd/amd64

      - name: Read digests
        id: digests
        run: |
          echo "default_amd64=$(cat digests/default/amd64/digest-default-amd64.txt)" >> "$GITHUB_OUTPUT"
          echo "default_arm64=$(cat digests/default/arm64/digest-default-arm64.txt)" >> "$GITHUB_OUTPUT"
          echo "amd_amd64=$(cat digests/amd/amd64/digest-amd-amd64.txt)" >> "$GITHUB_OUTPUT"

      # ---- main branch -------------------------------------------------------
      - name: Push manifests (main branch)
        if: github.ref_type == 'branch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/frigate-docker"

          # default variant
          for TAG in main "${{ github.sha }}"; do
            docker manifest create "$IMAGE:$TAG" \
              --amend "$IMAGE@${{ steps.digests.outputs.default_amd64 }}" \
              --amend "$IMAGE@${{ steps.digests.outputs.default_arm64 }}"
            docker manifest push "$IMAGE:$TAG"
          done

          # amd variant
          for TAG in main-amd "${{ github.sha }}-amd"; do
            docker manifest create "$IMAGE:$TAG" \
              --amend "$IMAGE@${{ steps.digests.outputs.amd_amd64 }}"
            docker manifest push "$IMAGE:$TAG"
          done

      # ---- version tag -------------------------------------------------------
      - name: Push manifests (version tag)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner }}/frigate-docker"
          VER="${{ steps.vars.outputs.version }}"

          # default variant
          for TAG in "$VER" latest "${{ github.sha }}"; do
            docker manifest create "$IMAGE:$TAG" \
              --amend "$IMAGE@${{ steps.digests.outputs.default_amd64 }}" \
              --amend "$IMAGE@${{ steps.digests.outputs.default_arm64 }}"
            docker manifest push "$IMAGE:$TAG"
          done

          # amd variant
          for TAG in "$VER-amd" latest-amd; do
            docker manifest create "$IMAGE:$TAG" \
              --amend "$IMAGE@${{ steps.digests.outputs.amd_amd64 }}"
            docker manifest push "$IMAGE:$TAG"
          done
