# Docker Compose examples for Frigate with GPU support

# GPU support requires Frigate 1.5.0 or later.
# Set computeBackend = "AUTO" (default) in config.toml to let Frigate auto-detect
# the best available backend, or set "GPU" to require GPU or fail.

services:
  frigate:
    image: ghcr.io/remcoros/frigate-docker:latest
    container_name: frigate
    restart: unless-stopped
    ports:
      - "57001:57001"
    volumes:
      - /home/user/.frigate:/root/.frigate

  # ── NVIDIA ──────────────────────────────────────────────────────────────────
  # Prerequisites:
  #   - NVIDIA driver 570.86.15+ on the host
  #   - nvidia-container-toolkit installed (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html)
  #
  frigate-nvidia:
    image: ghcr.io/remcoros/frigate-docker:latest
    container_name: frigate
    restart: unless-stopped
    ports:
      - "57001:57001"
    volumes:
      - /home/user/.frigate:/root/.frigate
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Intel iGPU (OpenCL) ─────────────────────────────────────────────────────
  # The Intel OpenCL runtime is bundled in the image.
  # Prerequisites:
  #   - User running the container must be in the 'render' group, or run as root
  #     (add with: sudo usermod -aG render $USER, then log out and back in)
  #
  frigate-intel:
    image: ghcr.io/remcoros/frigate-docker:latest
    container_name: frigate
    restart: unless-stopped
    ports:
      - "57001:57001"
    volumes:
      - /home/user/.frigate:/root/.frigate
    devices:
      - /dev/dri:/dev/dri

  # ── AMD (OpenCL via ROCm) ───────────────────────────────────────────────────
  # Prerequisites:
  #   - ROCm or AMDGPU-PRO OpenCL runtime installed on the host
  #     (https://rocm.docs.amd.com/en/latest/deploy/linux/index.html)
  #   - User running the container must be in the 'render' and 'video' groups
  #
  frigate-amd:
    image: ghcr.io/remcoros/frigate-docker:latest
    container_name: frigate
    restart: unless-stopped
    ports:
      - "57001:57001"
    volumes:
      - /home/user/.frigate:/root/.frigate
      # Mount ROCm OpenCL runtime from host so the container can use it
      - /etc/OpenCL/vendors:/etc/OpenCL/vendors:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
